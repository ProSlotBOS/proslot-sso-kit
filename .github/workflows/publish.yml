name: Publish @proslotbosllc/sso-kit

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: lets npm verify this workflow as a trusted publisher

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 ships npm >= 11, required for OIDC trusted publishing.
      # Node 20 ships npm 10.x, which silently falls back to token auth.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm supports trusted publishing
        run: |
          echo "npm $(npm -v)"
          node -e "const [maj,min,pat]=require('child_process').execSync('npm -v').toString().trim().split('.').map(Number);
            if (maj<11 || (maj===11 && min<5)) { console.error('npm >= 11.5.1 required for OIDC'); process.exit(1); }"

      # Install scripts never run in this job: it holds the OIDC token npm trusts
      # to publish this kit, and a dependency's script could publish with it.
      # The build runs explicitly below.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      # The tests import the build, so they run after it. A red test stops the
      # publish: the sign-in redirect and PKCE checks are what they pin.
      - run: npm test

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived publish credential, and attaches build provenance.
      - name: Publish
        run: npm publish --access public --provenance
